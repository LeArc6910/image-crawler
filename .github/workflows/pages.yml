# Publishes the PWA viewer (pwa/) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# The viewer holds no secrets; keys arrive only via the passphrase-sealed bundle on the phone.
name: Deploy viewer

on:
  push:
    branches: [main]
    paths: ["pwa/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # A new service-worker cache name per commit, so phones pick up the new app code.
      - run: sed -i "s/^const VERSION = .*/const VERSION = \"${GITHUB_SHA::12}\";/" pwa/sw.js && grep '^const VERSION' pwa/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - id: deployment
        uses: actions/deploy-pages@v4
